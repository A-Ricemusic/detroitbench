<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><title>DetroitBench · Run library</title><style>:root{color-scheme:light dark;--bg:#f5f6f8;--surface:#fff;--surface-2:#eef1f4;--node:#fff;--node-hover:#f1f6f7;--chart:#eef1f4;--text:#16202a;--text-2:#4b5866;--text-3:#6b7785;--border:#dfe3e8;--border-strong:#c3cad3;--accent:#0a6a76;--accent-soft:#e2f0f2;--accent-text:#fff;--edge:#9aa6b2;--connor:#0e7c89;--kara:#a35c0a;--markus:#6a4cad;--player:#5e6b7a;--shadow:0 1px 2px rgb(16 24 40/.05),0 1px 3px rgb(16 24 40/.06);--radius:14px;--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#0f1217;--surface:#171b21;--surface-2:#20262e;--node:#1c2129;--node-hover:#242b34;--chart:#12161b;--text:#e9edf2;--text-2:#aab4bf;--text-3:#8792a0;--border:#2a313a;--border-strong:#3c4550;--accent:#5fc6d1;--accent-soft:#143338;--accent-text:#0b1a1d;--edge:#5b6774;--connor:#56c2ce;--kara:#e3a552;--markus:#ab95ee;--player:#9aa6b4;--shadow:none}}
*,*::before,*::after{box-sizing:border-box}html{background:var(--bg);color:var(--text);-webkit-text-size-adjust:100%;text-size-adjust:100%}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 var(--font);-webkit-font-smoothing:antialiased;overflow-wrap:break-word}
main{max-width:1040px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(40px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}@media(min-width:720px){main{padding:44px 32px 64px}}
h1,h2,h3,p,dl,dd,ul{margin:0}h1{font-size:clamp(30px,8.5vw,46px);line-height:1.1;letter-spacing:-.02em;font-weight:700}h2{font-size:clamp(21px,5.6vw,26px);line-height:1.25;letter-spacing:-.01em}h3{font-size:17px;line-height:1.35;margin-top:20px}p+p{margin-top:.75em}
a{color:var(--accent);text-underline-offset:3px;text-decoration-thickness:1px}:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}.lede{color:var(--text-2)}.fine{font-size:14px;color:var(--text-2)}
.card{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);padding:20px 18px;margin:16px 0;box-shadow:var(--shadow)}@media(min-width:720px){.card{padding:28px 32px}}
button,.button,select{font:inherit;font-size:15px;font-weight:600;color:var(--text);background:var(--surface);border:1px solid var(--border-strong);border-radius:10px;padding:10px 16px;min-height:44px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;-webkit-tap-highlight-color:transparent}
button,.button{-webkit-appearance:none;appearance:none}.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}button:disabled{opacity:.4;cursor:default}.endings{display:grid;gap:8px;margin:12px 0 0}.endings div{padding:10px 12px;border-radius:10px;background:var(--surface-2);border-left:4px solid var(--c)}.endings dt{font-weight:700;font-size:13px;color:var(--text-2)}.endings dd{margin-top:2px;font-size:14px;line-height:1.45}header{margin-bottom:8px}header h1{margin:10px 0 8px}.runs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px;margin-top:24px}.runs .card{margin:0;display:flex;flex-direction:column;gap:6px}.runs h2{font-size:21px}.runs .model{font:13px/1.4 var(--mono);color:var(--text-2)}.runs .facts{color:var(--text-2);font-size:15px}.runs .links{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}</style></head><body><main><header><p class="eyebrow">DetroitBench</p><h1>Run library</h1><p class="lede">Each model playthrough has its own standalone report: character summaries, a tappable flowchart of every decision, and the recorded ending. Only fresh neutral-protocol runs appear here.</p></header><div class="runs"></div><p class="lede">Fresh runs will appear here after they complete.</p></main></body></html>
